- text: |-
    I dwell in Possibility —
    A fairer House than Prose —
  author: Emily Dickinson
  source: I dwell in Possibility

- text: >-
    Thy infinite gifts come to me only on these very small hands of mine.
  author: Rabindranath Tagore
  source: Gitanjali

- text: >-
    A whale is a spouting fish with a horizontal tail.
  author: Herman Melville
  source: Moby-Dick

- text: >-
    No dia seguinte ninguém morreu.
  author: José Saramago
  source: As Intermitências da Morte

- text: >-
    Como quem fecha numa gota
    o Oceano,
    afogado no fundo de si mesmo...
  author: João Guimarães Rosa
  source: "Saudade, Magma"

- text: >-
    Sou a charneca rude a abrir em flor!
  author: Florbela Espanca
  source: Charneca em Flor

- text: >-
    God keep me from ever completing anything.
  author: Herman Melville
  source: Moby-Dick

- text: >-
    The process of discovering, the everlasting and perpetual process, not the discovery itself, at all.
  author: Fyodor Dostoevsky
  source: The Idiot

- text: >-
    And fact is the most stubborn thing in the world.
  author: Mikhail Bulgakov
  source: The Master and Margarita

- text: >-
    The painting did not exist until I made it.
  author: Kurt Vonnegut
  source: Breakfast of Champions

- text: >-
    All of old. Nothing else ever. Ever tried. Ever failed. No matter.
    Try again. Fail again. Fail better.
  author: Samuel Beckett
  source: Worstward Ho

- text: >-
    Eu atravesso as coisas — e no meio da travessia não vejo!
  author: João Guimarães Rosa
  source: 'Grande Sertão: Veredas'

- text: >-
    Nem consta que tivesse biblioteca...
  author: Fernando Pessoa
  source: Liberdade
